# Mirrors the local gate exactly, so green-local means green-CI:
#   pnpm run lint     -> tsc --noEmit && eslint src
#   pnpm run coverage -> vitest, which fails below 100% coverage
#   pnpm run build    -> tsc -b && vite build
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors outright when
      # it is given one AND package.json declares `packageManager`, and the
      # manifest is the right single source: it is what corepack, local
      # installs and the dependency-freshness gate all read.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "24.20.0"

      # --frozen-lockfile: fails on a lockfile that does not match
      # package.json rather than silently resolving something else.
      - run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: pnpm run lint

      - name: Tests + 100% coverage
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

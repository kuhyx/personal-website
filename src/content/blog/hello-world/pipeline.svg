<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img"
     aria-label="Markdown becomes a bundle, then a prerendered HTML file per post">
  <style>
    /* An SVG loaded through &lt;img&gt; still sees the user agent's colour
       scheme, so the diagram tracks the site theme instead of picking one. */
    .box  { fill: #fcfbfb; stroke: #e0dad7; }
    .text { fill: #211d1b; }
    .dim  { fill: #70625b; }
    .flow { stroke: #b8862e; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #2b2624; stroke: #463e3a; }
      .text { fill: #eceae9; }
      .dim  { fill: #aaa09a; }
    }
  </style>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="box" x="8" y="34" width="176" height="62" rx="12" stroke-width="1.5"/>
    <text class="text" x="96" y="62" font-size="15" font-weight="600">DOCS-index.md</text>
    <text class="dim" x="96" y="81" font-size="12">+ colocated images</text>

    <rect class="box" x="232" y="34" width="176" height="62" rx="12" stroke-width="1.5"/>
    <text class="text" x="320" y="62" font-size="15" font-weight="600">pnpm build</text>
    <text class="dim" x="320" y="81" font-size="12">bundle, then prerender</text>

    <rect class="box" x="456" y="34" width="176" height="62" rx="12" stroke-width="1.5"/>
    <text class="text" x="544" y="62" font-size="15" font-weight="600">blog/&lt;slug&gt;/</text>
    <text class="dim" x="544" y="81" font-size="12">index.html, with meta</text>

    <g class="flow" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M192 65h32m0 0-8-6m8 6-8 6"/>
      <path d="M416 65h32m0 0-8-6m8 6-8 6"/>
    </g>
  </g>
</svg>
